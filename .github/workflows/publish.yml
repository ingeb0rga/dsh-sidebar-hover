# Publishes to npm on a version tag (v0.1.23 → package.json 0.1.23) through
# npm trusted publishing (GitHub OIDC): no npm token is stored anywhere, and
# npm attaches a provenance attestation automatically.
# npm side: package Settings → Trusted Publisher → GitHub Actions,
# user ingeb0rga, repo dsh-sidebar-hover, workflow publish.yml.
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != package.json v${version}"; exit 1; }
      - run: npm ci
      # prepublishOnly runs typecheck + tests + build before the upload.
      - run: npm publish
